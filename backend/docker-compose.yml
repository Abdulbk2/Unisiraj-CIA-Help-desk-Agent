version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: unisiraj_cia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: unisiraj_user
      POSTGRES_PASSWORD: dev_postgres_password_123
      POSTGRES_DB: unisiraj_cia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unisiraj_user -d unisiraj_cia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unisiraj_cia_backend
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://unisiraj_user:dev_postgres_password_123@db:5432/unisiraj_cia_db
      - JWT_SECRET_KEY=dev_secret_key_unisiraj_cia_min_32_characters_long_replace_in_prod
      - TWILIO_PROVIDER=mock
      - BOOTSTRAP_ADMIN_ENABLED=true
      - BOOTSTRAP_ADMIN_EMAIL=admin@unisiraj.edu.my
      - BOOTSTRAP_ADMIN_PASSWORD=AdminSecurePassword123!
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
