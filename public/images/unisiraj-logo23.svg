<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <!-- Solid White Background preserving original logo canvas -->
  <rect width="1200" height="600" fill="#FFFFFF"/>

  <!-- ========================================== -->
  <!-- LEFT SECTION: UniSIRAJ Crest and Typography -->
  <!-- ========================================== -->
  <g id="unisiraj-brand" transform="translate(40, 0)">
    <!-- DIAMOND CREST -->
    <g transform="translate(260, 195)">
      <!-- Outer Rotated Navy Diamond (Square rotated 45 deg) -->
      <rect x="-95" y="-95" width="190" height="190" rx="14" transform="rotate(45)" fill="#0B2545"/>

      <!-- Golden Kufic Geometric Pattern Frame -->
      <rect x="-82" y="-82" width="164" height="164" rx="8" transform="rotate(45)" fill="none" stroke="#EAA824" stroke-width="9"/>

      <!-- Kufic Corner Calligraphy Cutouts -->
      <g transform="rotate(45)">
        <!-- Corner Notch blocks -->
        <rect x="-96" y="-96" width="18" height="18" fill="#0B2545"/>
        <rect x="78" y="-96" width="18" height="18" fill="#0B2545"/>
        <rect x="-96" y="78" width="18" height="18" fill="#0B2545"/>
        <rect x="78" y="78" width="18" height="18" fill="#0B2545"/>

        <!-- Middle edge notches -->
        <rect x="-14" y="-96" width="28" height="12" fill="#0B2545"/>
        <rect x="-14" y="84" width="28" height="12" fill="#0B2545"/>
        <rect x="-96" y="-14" width="12" height="28" fill="#0B2545"/>
        <rect x="84" y="-14" width="12" height="28" fill="#0B2545"/>

        <!-- Quadrant L-mazes -->
        <path d="M-64 -64 H-30 V-44 H-46 V-30 H-64 Z" fill="#EAA824"/>
        <path d="M64 -64 H30 V-44 H46 V-30 H64 Z" fill="#EAA824"/>
        <path d="M-64 64 H-30 V44 H-46 V30 H-64 Z" fill="#EAA824"/>
        <path d="M64 64 H30 V44 H46 V30 H64 Z" fill="#EAA824"/>

        <!-- Concentric Inner Golden Square -->
        <rect x="-42" y="-42" width="84" height="84" fill="#0B2545" stroke="#EAA824" stroke-width="7"/>

        <!-- Center White Diamond -->
        <rect x="-30" y="-30" width="60" height="60" fill="#FFFFFF"/>
      </g>

      <!-- Center Golden 8-Pointed Rosette Star -->
      <g>
        <rect x="-18" y="-18" width="36" height="36" fill="#EAA824"/>
        <rect x="-18" y="-18" width="36" height="36" transform="rotate(45)" fill="#EAA824"/>
        <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- UniSIRAJ TEXT -->
    <g transform="translate(260, 390)">
      <!-- "UniSIRAJ" Wordmark -->
      <text text-anchor="middle" y="0">
        <tspan font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="74" fill="#0B2545">Uni</tspan>
        <tspan font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="74" fill="#EAA824">SIRAJ</tspan>
      </text>

      <!-- Golden Horizontal Rule -->
      <rect x="-190" y="16" width="380" height="4.5" fill="#EAA824" rx="2"/>

      <!-- Subtitles -->
      <text text-anchor="middle" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="bold" font-size="14.5" letter-spacing="1.5" fill="#0B2545">
        UNIVERSITI ISLAM ANTARABANGSA
      </text>
      <text text-anchor="middle" y="66" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="bold" font-size="13.5" letter-spacing="1.8" fill="#0B2545">
        TUANKU SYED SIRAJUDDIN
      </text>
      <text text-anchor="middle" y="87" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="bold" font-size="12.5" letter-spacing="3" fill="#0B2545">
        UNISIRAJ
      </text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- CENTER VERTICAL DIVIDER PILLAR             -->
  <!-- ========================================== -->
  <line x1="520" y1="130" x2="520" y2="470" stroke="#0B2545" stroke-width="4.5" stroke-linecap="round"/>

  <!-- ========================================== -->
  <!-- RIGHT SECTION: CIA Helpdesk Agent          -->
  <!-- ========================================== -->
  <g id="cia-helpdesk-brand" transform="translate(560, 0)">
    <!-- AGENT CIRCULAR EMBLEM -->
    <g transform="translate(130, 260)">
      <!-- Outer Navy Arch (open at bottom) -->
      <circle cx="0" cy="-8" r="95" fill="none" stroke="#0B2545" stroke-width="11" stroke-linecap="round"/>

      <!-- Headset Arch Band -->
      <path d="M-68 -10 C-68 -60, 68 -60, 68 -10" fill="none" stroke="#0B2545" stroke-width="9" stroke-linecap="round"/>
      <!-- Headset Ear-Pads -->
      <rect x="-78" y="-22" width="16" height="36" rx="8" fill="#0B2545"/>
      <rect x="62" y="-22" width="16" height="36" rx="8" fill="#0B2545"/>

      <!-- Microphone Arm & Mouthpiece -->
      <path d="M68 0 C68 32, 38 42, 14 36" fill="none" stroke="#0B2545" stroke-width="6" stroke-linecap="round"/>
      <circle cx="10" cy="36" r="6.5" fill="#0B2545"/>

      <!-- Mortarboard Cap (Graduation Cap) -->
      <!-- Diamond Plate -->
      <polygon points="0,-72 70,-46 0,-20 -70,-46" fill="#0B2545" stroke="#FFFFFF" stroke-width="2.5"/>
      <!-- Cap Base Band -->
      <path d="M-44 -38 Q0 -20 44 -38 L44 -26 Q0 -8 -44 -26 Z" fill="#081A32"/>

      <!-- Cap Golden Tassel -->
      <path d="M44 -44 C54 -34, 58 -16, 56 -2" fill="none" stroke="#EAA824" stroke-width="5" stroke-linecap="round"/>
      <circle cx="56" cy="2" r="5" fill="#EAA824"/>
      <line x1="53" y1="5" x2="59" y2="18" stroke="#EAA824" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Student Silhouette Head -->
      <circle cx="0" cy="2" r="28" fill="#0B2545"/>

      <!-- White V-Neck Shirt Collar -->
      <polygon points="-10,30 0,42 10,30 5,28 0,35 -5,28" fill="#FFFFFF"/>

      <!-- Torso / Suit V-Shape -->
      <path d="M-36 34 Q0 50 36 34 L28 72 Q0 90 -28 72 Z" fill="#0B2545"/>

      <!-- Sweeping Golden Wings / Laurel Embraces -->
      <!-- Left Golden Wing -->
      <path d="M-98 12 C-86 42, -50 78, -4 86 C-34 78, -70 58, -88 32 C-94 22, -98 12, -98 12 Z" fill="#EAA824"/>
      <!-- Right Golden Wing -->
      <path d="M98 12 C86 42, 50 78, 4 86 C34 78, 70 58, 88 32 C94 22, 98 12, 98 12 Z" fill="#EAA824"/>

      <!-- Lower Navy Support Cradle -->
      <path d="M-82 38 C-68 68, -32 98, 0 108 C32 98, 68 68, 82 38 C64 68, 30 90, 0 92 C-30 90, -64 68, -82 38 Z" fill="#0B2545"/>
    </g>

    <!-- CIA HELPDESK AGENT TEXT -->
    <g transform="translate(255, 240)">
      <text y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="58" fill="#0B2545" letter-spacing="-0.5">
        CIA Helpdesk
      </text>
      <text y="68" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="58" fill="#EAA824" letter-spacing="-0.5">
        Agent
      </text>
    </g>

    <!-- SUBTITLE: VISA COMPLIANCE & RENEWAL SUPPORT -->
    <text x="35" y="420" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="bold" font-size="18" letter-spacing="4.5" fill="#0B2545">
      VISA COMPLIANCE &amp; RENEWAL SUPPORT
    </text>
  </g>
</svg>
